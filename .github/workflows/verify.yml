name: Verify MediaTeleBot

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: Build and inspect macOS package
        if: runner.os == 'macOS'
        run: |
          python build_pkg.py --unsigned
          pkgutil --expand-full dist/*.pkg expanded
          APP=$(find expanded -name MediaTeleBot.app -type d -print -quit)
          test -n "$APP"
          EXE="$APP/Contents/MacOS/MediaTeleBot"
          for arch in arm64 x86_64; do
            xcrun vtool -arch "$arch" -show-build "$EXE" | grep -E 'minos +12\.0'
          done
          codesign --verify --strict "$APP"
      - name: Build and check Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python build_windows.py
          python -m zipfile -t (Get-ChildItem dist/*.zip).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
